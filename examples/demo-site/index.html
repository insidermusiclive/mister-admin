<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo site</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
    header { display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; border-bottom: 1px solid #eee; }
    header img { height: 40px; }
    nav ul { list-style: none; display: flex; gap: 1rem; margin: 0; padding: 0; }
    nav li { position: relative; }
    nav li.has-children:hover > ul { display: block; }
    nav .ma-submenu { display: none; position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid #eee; padding: .5rem; flex-direction: column; min-width: 160px; }
    nav a.active { font-weight: bold; }
    .hero { position: relative; min-height: 50vh; display: grid; place-items: center; text-align: center; color: #fff; background: #333 center/cover; padding: 2rem; }
    .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
    .hero > div { position: relative; z-index: 1; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
    .btn { display: inline-block; background: var(--accent, #1f5eff); color: #fff; padding: .6rem 1.2rem; border-radius: 6px; text-decoration: none; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .events article { display: grid; grid-template-columns: 160px 1fr; gap: 1rem; margin-bottom: 1.5rem; }
    .events img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: .5rem; }
    .gallery img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; }
    html:not(.ma-ready) [data-ma], html:not(.ma-ready) [data-ma-html] { min-height: 1em; }
    footer { padding: 2rem; color: #666; font-size: .9rem; text-align: center; white-space: pre-line; }
  </style>
</head>
<body>
  <header>
    <img data-ma-img="settings.logo" alt="">
    <strong data-ma="settings.title"></strong>
    <nav data-ma-menu="navigation"></nav>
  </header>

  <section class="hero">
    <img data-ma-img="hero.image" sizes="100vw" alt="">
    <div>
      <h1 data-ma="hero.heading"></h1>
      <div data-ma-html="hero.text"></div>
      <a class="btn" data-ma-if="hero.button_label" data-ma="hero.button_label" href="#"></a>
    </div>
  </section>

  <main>
    <h2>Events</h2>
    <div class="events" data-ma-list="events" data-ma-filter="published" data-ma-empty="No upcoming events.">
      <article>
        <img data-ma-img="photo" sizes="160px" alt="">
        <div>
          <h3 data-ma="name"></h3>
          <p><span data-ma="date"></span> · <span data-ma="category"></span> · € <span data-ma="price"></span> <strong data-ma-if="sold_out">SOLD OUT</strong></p>
          <div data-ma-html="description"></div>
        </div>
      </article>
    </div>

    <h2>Gallery</h2>
    <div class="gallery" data-ma-list="gallery.photos">
      <img data-ma-img="" sizes="200px" alt="">
    </div>
  </main>

  <footer>
    <div data-ma="settings.address"></div>
    <a data-ma="settings.phone" data-ma-attr="href" data-ma-prefix="tel:"><span data-ma="settings.phone"></span></a>
  </footer>

  <!-- Replace the two data-* values with your admin address and your site slug -->
  <script src="http://localhost:8788/client/mister-admin.js" data-admin="http://localhost:8788" data-site="demo" defer></script>
  <script>
    // Optional: use values from JavaScript too (here: the accent colour)
    document.addEventListener('ma:ready', (e) => {
      const c = e.detail.settings && e.detail.settings.accent_color;
      if (c) document.documentElement.style.setProperty('--accent', c);
      const btn = document.querySelector('.hero .btn');
      if (btn && e.detail.hero && e.detail.hero.button_url) btn.href = e.detail.hero.button_url;
    });
  </script>
</body>
</html>
