# Mister Admin - Cloudflare Worker configuration.
# "Deploy to Cloudflare" reads this file and creates the database and storage bucket for you.
# See docs/03-setup-cloudflare.md.

name = "mister-admin"
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "mister-admin"
database_id = "mister-admin"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "mister-admin-media"

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
fallthrough = true

[vars]
# Optional. If you connect a custom domain to the R2 bucket, put it here
# (e.g. "https://media.example.com"). Leave empty to serve photos through the app at /media/...
MEDIA_BASE_URL = ""
# Session length in days
SESSION_DAYS = "30"

[observability]
enabled = true
